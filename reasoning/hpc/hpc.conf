# NUS HPC settings used by every script in hpc/. Checked on the real system 2026-10-26 (check_system.sh):
# RHEL 9.4, login node stdct-login-01 (has internet), GPU nodes = NVIDIA A40 48 GB x2 (bfloat16 OK).

HPC_HOST=nus-vanda                       # ssh short name (see ~/.ssh/config on the laptop)
ROOT=/scratch/$USER/bn4601a              # big shared space (/hpctmp does not exist on this system)
VENV=$ROOT/venv2                         # Python 3.11 env (torch locked to the CUDA 12.6 build); venv/ = old broken try, can be deleted
HF_HOME=$ROOT/hf_cache                   # downloaded models live here (jobs run offline)

GPU_QUEUE=auto_free                      # free routing queue -> forwards GPU jobs to the gpu queue (charge 0, A40, max 2 running, 48 h); qsub -q gpu directly is denied
GPU_SELECT="select=1:ncpus=8:mem=64gb:ngpus=1"   # 1 A40 per job: one LoRA arm per GPU
MAX_WALLTIME=48:00:00                    # longest job allowed in the gpu queue
PBS_PROJECT=                             # not needed for the gpu queue
CUDA_TAG=cu126                           # PyTorch built for CUDA 12.6: runs on the HPC driver (CUDA 12.4); the newest default needs CUDA 13
TORCH_VERSION=2.14.1                     # newest PyTorch that has a CUDA 12.6 build

LR=1e-4                                  # LoRA learning rate: stage 1 plateaued at 2e-4 (val loss 2.179 -> 2.182)
TRAIN_BATCH="--batch 8 --grad-acc 2"     # 16 examples per update, as before; bigger batches suit the A40 in bf16
